[project]
name = "quercus-mcp"
version = "0.1.0"
description = "MCP server that syncs your Quercus (Canvas LMS) courses locally and lets Claude search and read them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "markdownify>=0.13",
    "keyring>=25",
    "typer>=0.12",
]

[project.scripts]
quercus = "quercus_mcp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quercus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
